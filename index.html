<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa dos Direitos — CEDECA Tocantins</title>
  <meta name="description" content="Construindo a Casa dos Direitos. Há quase 20 anos o CEDECA Tocantins defende os direitos de crianças e adolescentes.">

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @font-face{font-family:'Aeonik';src:url('assets/fonts/Aeonik-Light.otf') format('opentype');font-weight:300;font-display:swap}
    @font-face{font-family:'Aeonik';src:url('assets/fonts/Aeonik-Regular.otf') format('opentype');font-weight:400;font-display:swap}
    @font-face{font-family:'Aeonik';src:url('assets/fonts/Aeonik-Medium.otf') format('opentype');font-weight:500;font-display:swap}
    @font-face{font-family:'Aeonik';src:url('assets/fonts/Aeonik-Bold.otf') format('opentype');font-weight:700;font-display:swap}
    @font-face{font-family:'Aeonik';src:url('assets/fonts/Aeonik-Black.otf') format('opentype');font-weight:900;font-display:swap}

    *,*::before,*::after{font-family:'Aeonik',system-ui,sans-serif}
    html{scroll-behavior:smooth}
    ::selection{background:#D4FF00;color:#1A1A1A}

    .font-display{font-family:'Aeonik',system-ui,sans-serif;letter-spacing:-0.03em}
    h1,h2,h3,h4,h5{font-family:'Aeonik',system-ui,sans-serif;letter-spacing:-0.03em}

    .organic-shape-1{border-radius:60px 140px 60px 40px}
    .organic-shape-2{border-radius:40px 40px 140px 40px}
    .organic-shape-3{border-radius:100px 40px 40px 100px}
    .organic-shape-4{border-radius:40px 80px 40px 80px}

    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .float-anim{animation:float 6s ease-in-out infinite}

    @keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .marquee-anim{animation:marquee 28s linear infinite;width:max-content;display:flex;align-items:center;gap:2rem;white-space:nowrap}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── icons ── */
const IcoShield    = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
const IcoCheck     = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
const IcoHome      = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
const IcoArrow     = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
const IcoHeart     = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
const IcoArrowUR   = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>;

/* ── scroll animation hook ── */
const useReveal = () => {
  const [vis, setVis] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if(e.isIntersecting){setVis(true);obs.unobserve(e.target)} }, {threshold:0.1,rootMargin:'0px 0px -40px 0px'});
    if(ref.current) obs.observe(ref.current);
    return () => { if(ref.current) obs.unobserve(ref.current) };
  }, []);
  return [ref, vis];
};

const Reveal = ({children, delay=0, className=""}) => {
  const [ref, vis] = useReveal();
  return (
    <div ref={ref} style={{transitionDelay:`${delay}ms`}}
      className={`transition-all duration-700 ${vis?'opacity-100 translate-y-0':'opacity-0 translate-y-8'} ${className}`}>
      {children}
    </div>
  );
};

const OrgCard = ({children, bg, shape, className=""}) => {
  const [ref, vis] = useReveal();
  return (
    <div ref={ref}
      className={`relative p-8 md:p-12 transition-all duration-700 ${vis?'opacity-100 translate-y-0':'opacity-0 translate-y-10'} ${bg} ${shape} ${className}`}>
      {children}
    </div>
  );
};

const Tag = ({text, colorCls="bg-[#1A1A1A] text-white", align="left", dark=false}) => (
  <div className="w-full flex items-center my-6 relative">
    <div className={`h-px w-full absolute ${dark?'bg-white/30':'bg-[#1A1A1A]/20'}`}></div>
    <span className={`relative z-10 px-3 py-0.5 text-[10px] font-bold uppercase tracking-widest rounded-full border ${dark?'border-white/20':'border-[#1A1A1A]/20'} ${colorCls} ${align==='left'?'ml-6':align==='right'?'ml-auto mr-6':'mx-auto'}`}>
      {text}
    </span>
  </div>
);

/* ── APP ── */
function App() {
  const goTo = id => document.getElementById(id)?.scrollIntoView({behavior:'smooth'});

  return (
    <div className="min-h-screen bg-[#F2F0E6] text-[#1A1A1A] overflow-x-hidden">

      {/* ══ HEADER ══ */}
      <header className="fixed w-full top-0 z-50 bg-[#F2F0E6]/92 backdrop-blur-md border-b border-[#1A1A1A]/10">
        <div className="max-w-7xl mx-auto px-5 py-2 flex justify-between items-center">
          <img src="assets/logos/logo-casa-dark.png" alt="Casa dos Direitos" className="h-16 w-auto" />
          <button onClick={()=>goTo('doacao')}
            className="bg-[#1A1A1A] text-[#F2F0E6] px-6 py-3 rounded-full font-bold text-sm hover:bg-[#D4FF00] hover:text-[#1A1A1A] transition-colors duration-300">
            Doar agora
          </button>
        </div>
      </header>

      <main className="pt-24">

        {/* ══ HERO ══ */}
        <section className="max-w-7xl mx-auto px-6 pt-12 pb-20">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">

            <div>
              <Tag text="campanha de doação" align="left" />
              <Reveal>
                <h1 className="font-display text-5xl md:text-7xl font-black leading-[0.88] mb-6 uppercase">
                  Construindo a<br/>
                  <span className="text-[#0099FF]">Casa dos</span><br/>
                  <span className="text-[#FF5C39]">Direitos</span>
                </h1>
              </Reveal>
              <Reveal delay={150}>
                <p className="text-xl md:text-2xl font-medium mb-8 max-w-lg text-[#1A1A1A]/75">
                  Há quase 20 anos defendendo direitos de crianças e adolescentes. Agora precisamos de um espaço definitivo para continuar.
                </p>
                <div className="flex items-start gap-3 p-4 bg-[#D4FF00] w-fit mb-8 organic-shape-4">
                  <IcoShield c="w-7 h-7 flex-shrink-0 mt-0.5" />
                  <p className="font-bold text-sm leading-snug max-w-[240px]">
                    Não estamos construindo paredes. Estamos protegendo infâncias e adolescências.
                  </p>
                </div>
                <button onClick={()=>goTo('doacao')}
                  className="inline-flex items-center gap-2 bg-[#1A1A1A] text-[#F2F0E6] px-8 py-4 rounded-full font-bold text-lg hover:bg-[#0099FF] transition-colors duration-300">
                  Quero fazer parte <IcoArrow c="w-5 h-5" />
                </button>
              </Reveal>
            </div>

            <Reveal delay={300} className="relative">
              <div className="relative aspect-[4/3] w-full overflow-hidden organic-shape-1 float-anim">
                <div className="absolute inset-0 bg-[#0099FF]/10 mix-blend-multiply z-10 pointer-events-none"></div>
                <img src="assets/img/1.png" alt="Crianças se abraçando" className="w-full h-full object-cover" />
                <div className="absolute top-5 right-5 z-20 w-14 h-14 rounded-full bg-[#D4FF00] flex items-center justify-center font-black text-lg">CD</div>
              </div>
            </Reveal>
          </div>
        </section>

        {/* ══ MARQUEE ══ */}
        <div className="w-full bg-[#1A1A1A] text-[#F2F0E6] py-4 overflow-hidden">
          <div className="marquee-anim text-sm font-bold tracking-widest uppercase">
            {[1,2].map(k => (
              <span key={k} className="flex items-center gap-8">
                <span>ETAPA ATUAL: INÍCIO DA CONSTRUÇÃO DA SEDE</span>
                <span className="text-[#D4FF00]">✦</span>
                <span>QUERO FAZER PARTE DESSA CONSTRUÇÃO</span>
                <span className="text-[#D4FF00]">✦</span>
                <span>CEDECA TOCANTINS — 20 ANOS DE LUTA</span>
                <span className="text-[#D4FF00]">✦</span>
              </span>
            ))}
          </div>
        </div>

        {/* ══ CONTEXTO ══ */}
        <section className="py-24 bg-[#0099FF] text-[#F2F0E6]">
          <div className="max-w-7xl mx-auto px-6">
            <Tag text="contexto" colorCls="bg-[#D4FF00] text-[#1A1A1A]" align="center" dark />

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 mt-8">
              <div className="lg:col-span-5">
                <Reveal>
                  <h2 className="font-display text-5xl md:text-6xl font-black leading-none mb-6">
                    O que essa<br/>luta enfrenta<br/>todos os dias
                  </h2>
                  <p className="text-xl opacity-85">Cada caso precisa de um lugar que não desapareça.</p>
                </Reveal>
              </div>
              <div className="lg:col-span-7 flex flex-col gap-5">
                {[
                  "Violência sexual, marcada por desigualdades de gênero e raça.",
                  "Trabalho infantil e exploração.",
                  "Desafios no direito à participação de crianças e adolescentes.",
                  "O acesso à justiça que nem sempre chega para quem mais precisa."
                ].map((t,i) => (
                  <Reveal key={i} delay={i*90}>
                    <div className="flex gap-4 items-start border-b border-white/25 pb-5">
                      <div className="bg-[#D4FF00] text-[#1A1A1A] rounded-full p-0.5 mt-1 flex-shrink-0">
                        <IcoCheck c="w-5 h-5" />
                      </div>
                      <p className="text-xl font-medium">{t}</p>
                    </div>
                  </Reveal>
                ))}
              </div>
            </div>
          </div>
        </section>

        {/* ══ COMO ENFRENTAMOS ══ */}
        <section className="py-24 max-w-7xl mx-auto px-6">
          <Reveal className="text-center mb-14">
            <Tag text="nossa atuação" align="center" />
            <h2 className="font-display text-5xl font-black mb-5">Como enfrentamos isso</h2>
            <p className="text-xl max-w-2xl mx-auto text-[#1A1A1A]/70">
              O CEDECA atua diretamente na defesa dos direitos de crianças e adolescentes em seis frentes.
            </p>
          </Reveal>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            {[
              {t:"Proteção Jurídico Social",          bg:"bg-[#D4FF00]",              sh:"organic-shape-1"},
              {t:"Controle Social das Políticas Públicas", bg:"bg-[#F2F0E6] border-2 border-[#1A1A1A]", sh:"rounded-[36px]"},
              {t:"Incidência Política",               bg:"bg-[#FF5C39] text-white",   sh:"organic-shape-2"},
              {t:"Produção de Conteúdos",             bg:"bg-[#1A1A1A] text-white",   sh:"rounded-[36px]"},
              {t:"Formação do S.G.D.",                bg:"bg-[#0099FF] text-white",   sh:"organic-shape-3"},
              {t:"Comunicação por Direitos",          bg:"bg-[#FF3366] text-white",   sh:"rounded-[36px]"},
            ].map((item,i) => (
              <Reveal key={i} delay={i*80}>
                <div className={`${item.bg} ${item.sh} p-8 flex items-center min-h-[180px] hover:scale-[1.03] transition-transform duration-300`}>
                  <h3 className="font-display text-2xl font-bold leading-snug">{item.t}</h3>
                </div>
              </Reveal>
            ))}
          </div>

          <Reveal delay={200} className="mt-14 text-center max-w-3xl mx-auto">
            <p className="text-2xl font-medium leading-relaxed">
              Essa defesa acontece todos os dias.{" "}
              <span className="bg-[#D4FF00] px-2">Mas, sem uma sede própria, falta a estrutura necessária</span>{" "}
              para alcançar ainda mais pessoas.
            </p>
          </Reveal>
        </section>

        {/* ══ PROBLEMA + SOLUÇÃO ══ */}
        <section className="py-24 bg-[#FF5C39] text-white relative overflow-hidden">
          <div className="absolute top-0 right-0 w-96 h-96 bg-[#FF3366] rounded-full mix-blend-multiply blur-3xl opacity-50 pointer-events-none"></div>
          <div className="absolute bottom-0 left-0 w-80 h-80 bg-[#D4FF00] rounded-full mix-blend-multiply blur-3xl opacity-25 pointer-events-none"></div>

          <div className="max-w-7xl mx-auto px-6 relative z-10">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16">

              {/* Problema */}
              <div>
                <Tag text="o desafio" colorCls="bg-[#1A1A1A] text-white" dark />
                <Reveal>
                  <h2 className="font-display text-4xl md:text-5xl font-black mb-8">Uma luta essencial,<br/>sem um lugar fixo</h2>
                  <div className="space-y-3 mb-8">
                    {["Mudanças constantes de endereço","Perda de estrutura e materiais","Dificuldade de acesso para quem precisa","Impacto direto no acompanhamento das denúncias"].map((t,i) => (
                      <div key={i} className="flex gap-3 items-center bg-black/15 p-4 rounded-2xl font-medium">
                        <div className="w-2 h-2 bg-[#D4FF00] rounded-full flex-shrink-0"></div>
                        {t}
                      </div>
                    ))}
                  </div>
                  <div className="rounded-[24px] overflow-hidden mb-6">
                    <img src="assets/img/2.png" alt="Escritório improvisado do CEDECA" className="w-full max-h-64 object-cover" />
                  </div>
                  <p className="text-lg font-bold opacity-90">A defesa dos direitos não para. Mas com uma sede, ela ganha mais força e segurança.</p>
                </Reveal>
              </div>

              {/* Solução */}
              <OrgCard bg="bg-[#F2F0E6] text-[#1A1A1A]" shape="organic-shape-2 border-4 border-[#1A1A1A]">
                <div className="absolute top-6 right-6">
                  <IcoHome c="w-7 h-7 text-[#0099FF]" />
                </div>
                <Tag text="a solução" align="left" />
                <h2 className="font-display text-4xl md:text-5xl font-black mb-5">A Casa dos Direitos</h2>
                <p className="text-lg mb-5">
                  O CEDECA recebeu um terreno para construir sua sede própria.<br/>
                  <strong>Agora, esse espaço precisa sair do papel.</strong>
                </p>
                <div className="p-5 bg-[#0099FF]/10 rounded-2xl border border-[#0099FF]/30 mb-6">
                  <p className="text-[#0077CC] font-bold">Um lugar definitivo para fortalecer a defesa de direitos, ampliar a atuação e garantir presença contínua.</p>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <div className="rounded-[18px] overflow-hidden h-36">
                      <img src="assets/img/3.png" alt="Terreno adquirido" className="w-full h-full object-cover" />
                    </div>
                    <p className="text-xs font-bold text-center mt-2 text-[#1A1A1A]/55">Terreno adquirido</p>
                  </div>
                  <div>
                    <div className="rounded-[18px] overflow-hidden h-36">
                      <img src="assets/img/4.png" alt="Casa dos Direitos" className="w-full h-full object-cover" />
                    </div>
                    <p className="text-xs font-bold text-center mt-2 text-[#1A1A1A]/55">A Casa dos Direitos</p>
                  </div>
                </div>
              </OrgCard>

            </div>
          </div>
        </section>

        {/* ══ DEPOIMENTO ══ */}
        <section className="py-24 bg-[#1A1A1A] text-[#F2F0E6]">
          <div className="max-w-4xl mx-auto px-6 text-center">
            <Reveal>
              <div className="flex justify-center mb-8">
                <div className="w-28 h-28 rounded-full overflow-hidden border-4 border-[#D4FF00]">
                  <img src="assets/img/5.png" alt="Criança atendida pelo CEDECA" className="w-full h-full object-cover" />
                </div>
              </div>
              <h2 className="font-display text-4xl md:text-5xl font-black mb-10">Essa luta já mudou muitas histórias</h2>
              <blockquote className="text-2xl md:text-3xl font-display font-bold leading-snug text-[#D4FF00] mb-6">
                "Em um momento muito difícil, o CEDECA me escutou, me protegeu e me ajudou a recomeçar. Hoje eu sei que meus direitos importam e que não estou sozinha."
              </blockquote>
              <p className="text-lg opacity-60">— Ana Clara, 13 anos, atendida pelo CEDECA</p>
              <div className="mt-16 pt-12 border-t border-white/15">
                <p className="text-xl max-w-2xl mx-auto">
                  Há quase 20 anos, o CEDECA atua na defesa dos direitos de crianças e adolescentes, sendo <strong className="text-[#0099FF]">referência nacional</strong> nessa área.
                </p>
              </div>
            </Reveal>
          </div>
        </section>

        {/* ══ MOVIMENTO COLETIVO ══ */}
        <section className="py-24 bg-[#F2F0E6]">
          <div className="max-w-7xl mx-auto px-6">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
              <Reveal>
                <Tag text="movimento coletivo" align="left" />
                <h2 className="font-display text-5xl md:text-6xl font-black mb-6">Essa construção não acontece sozinha</h2>
                <p className="text-xl text-[#1A1A1A]/75 mb-8 max-w-lg">
                  Ela depende de pessoas que acreditam que defender direitos é um compromisso coletivo.
                  <span className="font-bold text-[#FF5C39]"> Cada doação é um passo na construção dessa casa.</span>
                </p>
                <button onClick={()=>goTo('doacao')}
                  className="inline-flex items-center gap-2 bg-[#1A1A1A] text-[#F2F0E6] px-8 py-4 rounded-full font-bold text-lg hover:bg-[#D4FF00] hover:text-[#1A1A1A] transition-colors duration-300">
                  Quero fazer parte <IcoHeart c="w-5 h-5" />
                </button>
              </Reveal>
              <Reveal delay={200}>
                <div className="rounded-[40px] overflow-hidden organic-shape-1 aspect-[4/3]">
                  <img src="assets/img/6.png" alt="Crianças unidas" className="w-full h-full object-cover" />
                </div>
              </Reveal>
            </div>
          </div>
        </section>

        {/* ══ DOAÇÃO ══ */}
        <section id="doacao" className="py-24 bg-[#F2F0E6]">
          <div className="max-w-7xl mx-auto px-6">
            <Reveal className="text-center mb-14">
              <Tag text="faça parte" align="center" />
              <h2 className="font-display text-4xl md:text-5xl font-black mb-4">Escolha como você quer<br/>fortalecer essa base</h2>
            </Reveal>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-7">

              {/* Doação única */}
              <Reveal delay={0}>
                <div className="bg-white rounded-[36px] p-8 border-2 border-[#1A1A1A] flex flex-col h-full hover:-translate-y-2 transition-transform duration-300 shadow-[6px_6px_0_rgba(26,26,26,1)]">
                  <span className="bg-[#D4FF00] w-fit px-4 py-1 rounded-full text-xs font-black border border-[#1A1A1A] mb-6 uppercase tracking-wide">Doação Única</span>
                  <h4 className="font-display text-2xl font-bold mb-4">Pequena contribuição,<br/>grande fundação</h4>
                  <p className="text-[#1A1A1A]/65 mb-8 flex-grow text-sm leading-relaxed">Sua contribuição apoia as etapas iniciais da construção e fortalece a base para que o CEDECA continue atuando.</p>
                  <p className="text-3xl font-black font-display mb-6">R$ 30, 50 ou 100</p>
                  <button className="w-full bg-[#1A1A1A] text-white py-4 rounded-full font-bold hover:bg-[#D4FF00] hover:text-[#1A1A1A] transition-colors border-2 border-[#1A1A1A] flex justify-center items-center gap-2">
                    Doar agora <IcoArrow c="w-4 h-4" />
                  </button>
                </div>
              </Reveal>

              {/* Doação mensal */}
              <Reveal delay={100}>
                <div className="bg-[#0099FF] text-white rounded-[36px] p-8 border-2 border-[#1A1A1A] flex flex-col h-full hover:-translate-y-2 transition-transform duration-300 shadow-[6px_6px_0_rgba(26,26,26,1)] relative overflow-hidden">
                  <div className="absolute -right-3 -top-3 w-20 h-20 bg-[#D4FF00] rounded-full mix-blend-multiply opacity-40 pointer-events-none"></div>
                  <span className="bg-[#FF3366] w-fit px-4 py-1 rounded-full text-xs font-black border border-[#1A1A1A] mb-6 uppercase tracking-wide">Doação Mensal</span>
                  <h4 className="font-display text-2xl font-bold mb-4">Sustente a estrutura<br/>do projeto</h4>
                  <p className="text-white/85 mb-4 flex-grow text-sm leading-relaxed">Sua doação mensal sustenta o avanço da obra e fortalece as ações contínuas de incidência e defesa.</p>
                  <p className="text-xs font-semibold text-[#D4FF00] mb-5 flex items-center gap-1"><IcoCheck c="w-4 h-4" /> Cancele quando quiser</p>
                  <p className="text-3xl font-black font-display mb-6">R$ 40, 100 ou 200<span className="text-base font-normal">/mês</span></p>

                    Ser doador mensal <IcoHeart c="w-4 h-4" />

                </div>
              </Reveal>

              {/* Doação maior */}
              <Reveal delay={200}>
                <div className="bg-[#FF5C39] text-white rounded-[36px] p-8 border-2 border-[#1A1A1A] flex flex-col h-full hover:-translate-y-2 transition-transform duration-300 shadow-[6px_6px_0_rgba(26,26,26,1)]">

                  <p className="text-3xl font-black font-display mb-6">Valor Aberto</p>
                  <button className="w-full bg-[#1A1A1A] text-white py-4 rounded-full font-bold hover:bg-[#F2F0E6] hover:text-[#1A1A1A] transition-colors border-2 border-[#1A1A1A] flex justify-center items-center gap-2">
                    Fazer doação maior <IcoArrowUR c="w-4 h-4" />

            </div>

            <div className="mt-10 flex justify-center items-center gap-2 text-[#1A1A1A]/50 text-sm font-medium">
              <IcoShield c="w-4 h-4" /> Doação 100% segura. Processo simples e rápido.

        </section>

        {/* ══ PARCEIROS ══ */}
        <section className="py-16 border-y border-[#1A1A1A]/10">
          <div className="max-w-5xl mx-auto px-6">
            <p className="text-center font-bold text-xs tracking-widest uppercase mb-10 text-[#1A1A1A]/50">Instituições que fazem acontecer</p>
            <div className="flex flex-wrap justify-center items-center gap-10 md:gap-16">
              <img src="assets/logos/logo-cedeca-preto.png"   alt="CEDECA"           className="h-20 w-auto object-contain grayscale hover:grayscale-0 transition-all duration-300" />
              <img src="assets/logos/logo-kinder-preto.png"   alt="Kindernothilfe"   className="h-10 w-auto object-contain grayscale hover:grayscale-0 transition-all duration-300" />
              <img src="assets/logos/logo-misereor-preto.png" alt="Misereor"         className="h-10 w-auto object-contain grayscale hover:grayscale-0 transition-all duration-300" />
            </div>
            <p className="text-center mt-10 text-[#1A1A1A]/65 font-medium max-w-md mx-auto text-sm">
              Uma organização com quase 20 anos de atuação na defesa de direitos humanos.
            </p>
          </div>
        </section>

      </main>

      {/* ══ FOOTER ══ */}
      <footer className="bg-[#1A1A1A] text-[#F2F0E6] py-20 relative overflow-hidden">
        <div className="absolute -bottom-1/2 -right-1/4 w-[700px] h-[700px] bg-[#D4FF00] rounded-full mix-blend-multiply opacity-15 blur-3xl pointer-events-none"></div>

        <div className="max-w-6xl mx-auto px-6 relative z-10">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center mb-16">
            <Reveal>
              <h2 className="font-display text-4xl md:text-5xl font-black mb-6 leading-tight">
                Construir essa casa é fortalecer o CEDECA para que siga atuando com ainda mais estrutura.
              </h2>

              </p>
              <button onClick={()=>goTo('doacao')}
                className="bg-[#D4FF00] text-[#1A1A1A] px-10 py-5 rounded-full font-display font-black text-xl hover:scale-105 transition-transform duration-300">

              </button>
            </Reveal>

            <Reveal delay={250} className="flex justify-center lg:justify-end">
              <div className="w-56 h-56 rounded-full overflow-hidden organic-shape-1 float-anim border-4 border-[#D4FF00]">
                <img src="assets/img/7.png" alt="Criança sorrindo" className="w-full h-full object-cover" />
              </div>
            </Reveal>
          </div>

          <div className="pt-8 border-t border-white/15 flex flex-col md:flex-row justify-between items-center gap-6">
            <img src="assets/logos/logo-cedeca-branca.png" alt="CEDECA" className="h-14 w-auto" />
            <div className="text-center">
              <p className="font-display font-bold">casa dos direitos</p>
              <a href="https://doar.cedecato.org.br" className="text-sm opacity-50 hover:opacity-80 transition-opacity">doar.cedecato.org.br</a>

            <p className="text-sm opacity-40">© {new Date().getFullYear()} CEDECA Tocantins</p>

    </div>
