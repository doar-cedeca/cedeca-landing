<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa dos Direitos — CEDECA Tocantins</title>
  <meta name="description" content="Construindo a Casa dos Direitos. Há quase 20 anos o CEDECA Tocantins defende os direitos de crianças e adolescentes.">

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @font-face{font-family:'Aeonik';src:url('assets/fonts/Aeonik-Light.otf') format('opentype');font-weight:300;font-display:swap}
    @font-face{font-family:'Aeonik';src:url('assets/fonts/Aeonik-Regular.otf') format('opentype');font-weight:400;font-display:swap}
    @font-face{font-family:'Aeonik';src:url('assets/fonts/Aeonik-Medium.otf') format('opentype');font-weight:500;font-display:swap}
    @font-face{font-family:'Aeonik';src:url('assets/fonts/Aeonik-Bold.otf') format('opentype');font-weight:700;font-display:swap}
    @font-face{font-family:'Aeonik';src:url('assets/fonts/Aeonik-Black.otf') format('opentype');font-weight:900;font-display:swap}

    *,*::before,*::after{font-family:'Aeonik',system-ui,sans-serif}
    html{scroll-behavior:smooth}
    ::selection{background:#D4FF00;color:#1A1A1A}
    .font-display{font-family:'Aeonik',system-ui,sans-serif;letter-spacing:-0.03em}
    h1,h2,h3,h4,h5{font-family:'Aeonik',system-ui,sans-serif;letter-spacing:-0.03em}

    .organic-shape-1{border-radius:60px 140px 60px 40px}
    .organic-shape-2{border-radius:40px 40px 140px 40px}
    .organic-shape-3{border-radius:100px 40px 40px 100px}
    .organic-shape-4{border-radius:40px 80px 40px 80px}

    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .float-anim{animation:float 6s ease-in-out infinite}

    @keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .marquee-anim{animation:marquee 28s linear infinite;width:max-content;display:flex;align-items:center;gap:2rem;white-space:nowrap}

    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .spin{animation:spin .8s linear infinite}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── icons ── */
const IcoShield  = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
const IcoCheck   = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
const IcoHome    = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
const IcoArrow   = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
const IcoHeart   = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
const IcoArrowUR = ({c}) => <svg className={c} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>;

/* ── scroll animation ── */
const useReveal = () => {
  const [vis, setVis] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if(e.isIntersecting){setVis(true);obs.unobserve(e.target)} }, {threshold:0.1,rootMargin:'0px 0px -40px 0px'});
    if(ref.current) obs.observe(ref.current);
    return () => { if(ref.current) obs.unobserve(ref.current) };
  }, []);
  return [ref, vis];
};

const Reveal = ({children, delay=0, className=""}) => {
  const [ref, vis] = useReveal();
  return (
    <div ref={ref} style={{transitionDelay:`${delay}ms`}}
      className={`transition-all duration-700 ${vis?'opacity-100 translate-y-0':'opacity-0 translate-y-8'} ${className}`}>
      {children}
    </div>
  );
};

const OrgCard = ({children, bg, shape, className=""}) => {
  const [ref, vis] = useReveal();
  return (
    <div ref={ref} className={`relative p-8 md:p-12 transition-all duration-700 ${vis?'opacity-100 translate-y-0':'opacity-0 translate-y-10'} ${bg} ${shape} ${className}`}>
      {children}
    </div>
  );
};

const Tag = ({text, colorCls="bg-[#1A1A1A] text-white", align="left", dark=false}) => (
  <div className="w-full flex items-center my-6 relative">
    <div className={`h-px w-full absolute ${dark?'bg-white/30':'bg-[#1A1A1A]/20'}`}></div>
    <span className={`relative z-10 px-3 py-0.5 text-[10px] font-bold uppercase tracking-widest rounded-full border ${dark?'border-white/20':'border-[#1A1A1A]/20'} ${colorCls} ${align==='left'?'ml-6':align==='right'?'ml-auto mr-6':'mx-auto'}`}>
      {text}
    </span>
  </div>
);

/* ══════════════════════════════════════════════
   DONATION SECTION — Sistema integrado ao Asaas
══════════════════════════════════════════════ */
function DonationSection() {
  const PRESETS = [5, 10, 20, 50, 100];

  // step: 'type' | 'amount'
  const [step,      setStep]      = useState('type');
  const [donType,   setDonType]   = useState(null);   // 'single' | 'monthly'
  const [selAmt,    setSelAmt]    = useState(null);   // number | 'other' | null
  const [customVal, setCustomVal] = useState('');
  const [loading,   setLoading]   = useState(false);
  const [errMsg,    setErrMsg]    = useState('');

  const isMonthly = donType === 'monthly';
  const suffix    = isMonthly ? '/mês' : '';

  const getFinalAmount = () => {
    if (selAmt === 'other') {
      const v = parseFloat(customVal.replace(/\./g,'').replace(',','.'));
      return (!isNaN(v) && v >= 5) ? v : null;
    }
    return typeof selAmt === 'number' ? selAmt : null;
  };

  const finalAmount = getFinalAmount();
  const canSubmit   = finalAmount !== null && !loading;

  const selectType = (t) => {
    setDonType(t);
    setStep('amount');
    setSelAmt(null);
    setCustomVal('');
    setErrMsg('');
  };

  const goBack = () => {
    setStep('type');
    setDonType(null);
    setSelAmt(null);
    setCustomVal('');
    setErrMsg('');
  };

  const handleCustomInput = (v) => {
    // Allow digits and comma/dot
    const clean = v.replace(/[^0-9,]/g, '').slice(0, 10);
    setCustomVal(clean);
    setErrMsg('');
  };

  const handleSubmit = async () => {
    const amount = getFinalAmount();
    if (!amount) {
      setErrMsg('Escolha ou informe um valor mínimo de R$ 5,00.');
      return;
    }
    setLoading(true);
    setErrMsg('');
    try {
      const res  = await fetch('/api/create-donation-checkout', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ type: donType, amount }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erro desconhecido');
      window.location.href = data.checkoutUrl;
    } catch (e) {
      setErrMsg('Não conseguimos iniciar sua doação agora. Tente novamente em alguns instantes.');
      setLoading(false);
    }
  };

  /* ---------- helpers for selected amount styling ---------- */
  const amtBase  = isMonthly ? 'border-white/30 bg-white/10 text-white hover:bg-white/20' : 'border-[#1A1A1A]/15 bg-[#F2F0E6] text-[#1A1A1A] hover:border-[#1A1A1A]/50';
  const amtSel   = 'border-[#1A1A1A] bg-[#D4FF00] text-[#1A1A1A] scale-[1.04]';
  const btnMain  = isMonthly
    ? 'bg-[#D4FF00] text-[#1A1A1A] hover:brightness-105'
    : 'bg-[#1A1A1A] text-white hover:bg-[#0099FF]';

  return (
    <section id="doacao" className="py-24 bg-[#F2F0E6]">
      <div className="max-w-3xl mx-auto px-6">

        {/* Header */}
        <Reveal className="text-center mb-12">
          <Tag text="faça parte" align="center" />
          <h2 className="font-display text-4xl md:text-5xl font-black mb-4">
            Escolha como você<br/>quer contribuir
          </h2>
          <p className="text-xl text-[#1A1A1A]/60 max-w-lg mx-auto">
            Cada doação é um passo concreto na construção da Casa dos Direitos.
          </p>
        </Reveal>

        {/* ── STEP 1: Type selection ── */}
        {step === 'type' && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">

            {/* Card — Doação Única */}
            <Reveal delay={0}>
              <button onClick={() => selectType('single')}
                className="w-full text-left bg-white rounded-[28px] p-7 border-2 border-[#1A1A1A] hover:-translate-y-1 active:scale-[0.98] transition-all duration-200 shadow-[4px_4px_0_rgba(26,26,26,1)] group">
                <span className="inline-block bg-[#D4FF00] px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wide border border-[#1A1A1A] mb-4">
                  Doação Única
                </span>
                <h3 className="font-display text-2xl font-black mb-2">Doação Única</h3>
                <p className="text-[#1A1A1A]/60 text-sm leading-relaxed mb-6">
                  Faça uma contribuição agora e ajude a transformar a vida de crianças e adolescentes em situação de vulnerabilidade.
                </p>
                <div className="inline-flex items-center gap-2 bg-[#1A1A1A] text-white px-5 py-3 rounded-full font-bold text-sm group-hover:bg-[#D4FF00] group-hover:text-[#1A1A1A] transition-colors">
                  Quero ajudar agora <IcoArrow c="w-4 h-4" />
                </div>
              </button>
            </Reveal>

            {/* Card — Apoiador Mensal */}
            <Reveal delay={100}>
              <button onClick={() => selectType('monthly')}
                className="w-full text-left bg-[#0099FF] text-white rounded-[28px] p-7 border-2 border-[#1A1A1A] hover:-translate-y-1 active:scale-[0.98] transition-all duration-200 shadow-[4px_4px_0_rgba(26,26,26,1)] group relative overflow-hidden">
                <div className="absolute -right-5 -top-5 w-24 h-24 bg-[#D4FF00] rounded-full mix-blend-multiply opacity-30 pointer-events-none"></div>
                <span className="inline-block bg-[#FF3366] text-white px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wide border border-[#1A1A1A]/40 mb-4">
                  Apoiador Mensal
                </span>
                <h3 className="font-display text-2xl font-black mb-2">Apoiador Mensal</h3>
                <p className="text-white/80 text-sm leading-relaxed mb-6">
                  Contribua todos os meses e ajude a manter esse trabalho acontecendo de forma contínua.
                </p>
                <div className="inline-flex items-center gap-2 bg-[#D4FF00] text-[#1A1A1A] px-5 py-3 rounded-full font-bold text-sm">
                  Tornar-me apoiador <IcoHeart c="w-4 h-4" />
                </div>
              </button>
            </Reveal>
          </div>
        )}

        {/* ── STEP 2: Amount selection ── */}
        {step === 'amount' && (
          <Reveal>
            <div className={`rounded-[32px] p-7 md:p-10 border-2 border-[#1A1A1A] ${isMonthly ? 'bg-[#0099FF] text-white' : 'bg-white text-[#1A1A1A]'}`}>

              {/* Top row */}
              <div className="flex items-start justify-between mb-7 gap-4">
                <div>
                  <span className={`inline-block px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wide border border-[#1A1A1A]/40 mb-2 ${isMonthly ? 'bg-[#FF3366] text-white' : 'bg-[#D4FF00] text-[#1A1A1A] border-[#1A1A1A]'}`}>
                    {isMonthly ? 'Apoiador Mensal' : 'Doação Única'}
                  </span>
                  <h3 className="font-display text-2xl font-black leading-tight">
                    {isMonthly ? 'Escolha seu apoio mensal' : 'Escolha o valor da sua doação'}
                  </h3>
                </div>
                <button onClick={goBack}
                  className={`flex-shrink-0 text-sm font-bold underline underline-offset-2 transition-opacity opacity-60 hover:opacity-100 mt-1 ${isMonthly ? 'text-white' : 'text-[#1A1A1A]'}`}>
                  ← Voltar
                </button>
              </div>

              {/* Preset amounts — 3 columns */}
              <div className="grid grid-cols-3 gap-3 mb-3">
                {PRESETS.map(v => (
                  <button key={v}
                    onClick={() => { setSelAmt(v); setCustomVal(''); setErrMsg(''); }}
                    className={`py-4 rounded-2xl font-black text-lg border-2 transition-all duration-150 ${selAmt === v ? amtSel : amtBase}`}>
                    R$&nbsp;{v}{suffix}
                  </button>
                ))}

                {/* Outro valor */}
                <button
                  onClick={() => { setSelAmt('other'); setErrMsg(''); }}
                  className={`py-4 rounded-2xl font-bold text-sm border-2 transition-all duration-150 ${selAmt === 'other' ? amtSel : amtBase}`}>
                  Outro valor
                </button>
              </div>

              {/* Custom amount input */}
              {selAmt === 'other' && (
                <div className="mb-4">
                  <label className={`block text-xs font-bold mb-1.5 ${isMonthly ? 'text-white/70' : 'text-[#1A1A1A]/60'}`}>
                    Valor (mínimo R$ 5,00){isMonthly ? '/mês' : ''}:
                  </label>
                  <div className="relative">
                    <span className={`absolute left-4 top-1/2 -translate-y-1/2 font-black text-lg pointer-events-none ${isMonthly ? 'text-white/70' : 'text-[#1A1A1A]/50'}`}>
                      R$
                    </span>
                    <input
                      type="text" inputMode="decimal" autoFocus
                      value={customVal}
                      onChange={e => handleCustomInput(e.target.value)}
                      placeholder="0,00"
                      className={`w-full pl-11 pr-4 py-4 rounded-2xl font-black text-xl border-2 outline-none transition-colors
                        ${isMonthly
                          ? 'bg-white/15 border-white/40 text-white placeholder-white/30 focus:border-white focus:bg-white/25'
                          : 'bg-[#F2F0E6] border-[#1A1A1A]/15 text-[#1A1A1A] placeholder-[#1A1A1A]/25 focus:border-[#1A1A1A]'}`}
                    />
                  </div>
                  {/* Inline validation hint */}
                  {customVal !== '' && finalAmount === null && (
                    <p className={`text-xs mt-1.5 font-medium ${isMonthly ? 'text-[#FFD4E0]' : 'text-red-500'}`}>
                      Valor mínimo: R$ 5,00
                    </p>
                  )}
                </div>
              )}

              {/* Error message */}
              {errMsg && (
                <div className={`mb-4 p-4 rounded-2xl text-sm font-medium border ${isMonthly ? 'bg-white/15 border-white/30 text-white' : 'bg-red-50 border-red-200 text-red-700'}`}>
                  {errMsg}
                </div>
              )}

              {/* Submit button */}
              <button
                onClick={handleSubmit}
                disabled={!canSubmit}
                className={`w-full py-5 mt-2 rounded-full font-black text-xl transition-all duration-200
                  ${!canSubmit ? 'opacity-40 cursor-not-allowed' : 'hover:scale-[1.02] active:scale-[0.99]'}
                  ${btnMain}`}>
                {loading ? (
                  <span className="flex items-center justify-center gap-3">
                    <svg className="spin w-5 h-5" viewBox="0 0 24 24" fill="none">
                      <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" opacity=".25"/>
                      <path fill="currentColor" opacity=".75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                    </svg>
                    Preparando checkout...
                  </span>
                ) : isMonthly ? 'Tornar-me apoiador mensal →' : 'Quero ajudar agora →'}
              </button>

              {/* Security note */}
              <p className={`text-center text-xs mt-4 flex items-center justify-center gap-1.5 ${isMonthly ? 'text-white/45' : 'text-[#1A1A1A]/35'}`}>
                <IcoShield c="w-3.5 h-3.5" /> Pagamento 100% seguro via Asaas
              </p>
            </div>
          </Reveal>
        )}

        {/* Security note (step 1) */}
        {step === 'type' && (
          <p className="mt-7 text-center flex items-center justify-center gap-2 text-[#1A1A1A]/40 text-sm font-medium">
            <IcoShield c="w-4 h-4" /> Doação 100% segura. Processo simples e rápido.
          </p>
        )}
      </div>
    </section>
  );
}

/* ══════════════════════════════════════════════
   APP
══════════════════════════════════════════════ */
function App() {
  const goTo = id => document.getElementById(id)?.scrollIntoView({behavior:'smooth'});

  return (
    <div className="min-h-screen bg-[#F2F0E6] text-[#1A1A1A] overflow-x-hidden">

      {/* ══ HEADER ══ */}
      <header className="fixed w-full top-0 z-50 bg-[#F2F0E6] border-b border-[#1A1A1A]/10">
        <div className="max-w-7xl mx-auto px-5 py-2 flex justify-between items-center">
          <img src="assets/logos/logo-casa-preta.png" alt="Casa dos Direitos" className="h-16 w-auto" />
          <button onClick={()=>goTo('doacao')}
            className="bg-[#1A1A1A] text-[#F2F0E6] px-6 py-3 rounded-full font-bold text-sm hover:bg-[#D4FF00] hover:text-[#1A1A1A] transition-colors duration-300">
            Doar agora
          </button>
        </div>
      </header>

      <main className="pt-24">

        {/* ══ HERO ══ */}
        <section className="max-w-7xl mx-auto px-6 pt-12 pb-20">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">
            <div>
              <Tag text="campanha de doação" align="left" />
              <Reveal>
                <h1 className="font-display text-5xl md:text-7xl font-black leading-[0.88] mb-6 uppercase">
                  Construindo a<br/>
                  <span className="text-[#0099FF]">Casa dos</span><br/>
                  <span className="text-[#FF5C39]">Direitos</span>
                </h1>
              </Reveal>
              <Reveal delay={150}>
                <p className="text-xl md:text-2xl font-medium mb-8 max-w-lg text-[#1A1A1A]/75">
                  Há quase 20 anos defendendo direitos de crianças e adolescentes. Agora precisamos de um espaço definitivo para continuar.
                </p>
                <div className="flex items-start gap-3 p-4 bg-[#D4FF00] w-fit mb-8 organic-shape-4">
                  <IcoShield c="w-7 h-7 flex-shrink-0 mt-0.5" />
                  <p className="font-bold text-sm leading-snug max-w-[240px]">
                    Não estamos construindo paredes. Estamos protegendo infâncias e adolescências.
                  </p>
                </div>
                <button onClick={()=>goTo('doacao')}
                  className="inline-flex items-center gap-2 bg-[#1A1A1A] text-[#F2F0E6] px-8 py-4 rounded-full font-bold text-lg hover:bg-[#0099FF] transition-colors duration-300">
                  Quero fazer parte <IcoArrow c="w-5 h-5" />
                </button>
              </Reveal>
            </div>

            <Reveal delay={300} className="relative">
              <div className="relative aspect-[4/3] w-full overflow-hidden organic-shape-1 float-anim">
                <div className="absolute inset-0 bg-[#0099FF]/10 mix-blend-multiply z-10 pointer-events-none"></div>
                <img src="assets/img/1.png" alt="Crianças se abraçando" className="w-full h-full object-cover" />
                <div className="absolute top-5 right-5 z-20 w-14 h-14 rounded-full bg-[#D4FF00] flex items-center justify-center font-black text-lg">CD</div>
              </div>
            </Reveal>
          </div>
        </section>

        {/* ══ MARQUEE ══ */}
        <div className="w-full bg-[#1A1A1A] text-[#F2F0E6] py-4 overflow-hidden">
          <div className="marquee-anim text-sm font-bold tracking-widest uppercase">
            {[1,2].map(k => (
              <span key={k} className="flex items-center gap-8">
                <span>ETAPA ATUAL: INÍCIO DA CONSTRUÇÃO DA SEDE</span>
                <span className="text-[#D4FF00]">✦</span>
                <span>QUERO FAZER PARTE DESSA CONSTRUÇÃO</span>
                <span className="text-[#D4FF00]">✦</span>
                <span>CEDECA TOCANTINS — 20 ANOS DE LUTA</span>
                <span className="text-[#D4FF00]">✦</span>
              </span>
            ))}
          </div>
        </div>

        {/* ══ CONTEXTO ══ */}
        <section className="py-24 bg-[#0099FF] text-[#F2F0E6]">
          <div className="max-w-7xl mx-auto px-6">
            <Tag text="contexto" colorCls="bg-[#D4FF00] text-[#1A1A1A]" align="center" dark />
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 mt-8">
              <div className="lg:col-span-5">
                <Reveal>
                  <h2 className="font-display text-5xl md:text-6xl font-black leading-none mb-6">
                    O que essa<br/>luta enfrenta<br/>todos os dias
                  </h2>
                  <p className="text-xl opacity-85">Cada caso precisa de um lugar que não desapareça.</p>
                </Reveal>
              </div>
              <div className="lg:col-span-7 flex flex-col gap-5">
                {[
                  "Violência sexual, marcada por desigualdades de gênero e raça.",
                  "Trabalho infantil e exploração.",
                  "Desafios no direito à participação de crianças e adolescentes.",
                  "O acesso à justiça que nem sempre chega para quem mais precisa."
                ].map((t,i) => (
                  <Reveal key={i} delay={i*90}>
                    <div className="flex gap-4 items-start border-b border-white/25 pb-5">
                      <div className="bg-[#D4FF00] text-[#1A1A1A] rounded-full p-0.5 mt-1 flex-shrink-0"><IcoCheck c="w-5 h-5" /></div>
                      <p className="text-xl font-medium">{t}</p>
                    </div>
                  </Reveal>
                ))}
              </div>
            </div>
          </div>
        </section>

        {/* ══ COMO ENFRENTAMOS ══ */}
        <section className="py-24 max-w-7xl mx-auto px-6">
          <Reveal className="text-center mb-14">
            <Tag text="nossa atuação" align="center" />
            <h2 className="font-display text-5xl font-black mb-5">Como enfrentamos isso</h2>
            <p className="text-xl max-w-2xl mx-auto text-[#1A1A1A]/70">
              O CEDECA atua diretamente na defesa dos direitos de crianças e adolescentes em seis frentes.
            </p>
          </Reveal>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            {[
              {t:"Proteção Jurídico Social",              bg:"bg-[#D4FF00]",              sh:"organic-shape-1"},
              {t:"Controle Social das Políticas Públicas", bg:"bg-[#F2F0E6] border-2 border-[#1A1A1A]", sh:"rounded-[36px]"},
              {t:"Incidência Política",                   bg:"bg-[#FF5C39] text-white",   sh:"organic-shape-2"},
              {t:"Produção de Conteúdos",                 bg:"bg-[#1A1A1A] text-white",   sh:"rounded-[36px]"},
              {t:"Formação do S.G.D.",                    bg:"bg-[#0099FF] text-white",   sh:"organic-shape-3"},
              {t:"Comunicação por Direitos",              bg:"bg-[#FF3366] text-white",   sh:"rounded-[36px]"},
            ].map((item,i) => (
              <Reveal key={i} delay={i*80}>
                <div className={`${item.bg} ${item.sh} p-8 flex items-center min-h-[180px] hover:scale-[1.03] transition-transform duration-300`}>
                  <h3 className="font-display text-2xl font-bold leading-snug">{item.t}</h3>
                </div>
              </Reveal>
            ))}
          </div>
          <Reveal delay={200} className="mt-14 text-center max-w-3xl mx-auto">
            <p className="text-2xl font-medium leading-relaxed">
              Essa defesa acontece todos os dias.{" "}
              <span className="bg-[#D4FF00] px-2">Mas, sem uma sede própria, falta a estrutura necessária</span>{" "}
              para alcançar ainda mais pessoas.
            </p>
          </Reveal>
        </section>

        {/* ══ PROBLEMA + SOLUÇÃO ══ */}
        <section className="py-24 bg-[#FF5C39] text-white relative overflow-hidden">
          <div className="absolute top-0 right-0 w-96 h-96 bg-[#FF3366] rounded-full mix-blend-multiply blur-3xl opacity-40 pointer-events-none"></div>
          <div className="absolute bottom-0 left-0 w-80 h-80 bg-[#D4FF00] rounded-full mix-blend-multiply blur-3xl opacity-20 pointer-events-none"></div>

          {/* SVG defs — clip-path orgânico para a imagem da sala */}
          <svg style={{position:'absolute',width:0,height:0,overflow:'hidden'}} aria-hidden="true">
            <defs>
              <clipPath id="officeClip" clipPathUnits="objectBoundingBox">
                <path d="M0.04,0 Q0.5,-0.01 0.96,0.01 Q1,0.01 1,0.07 L1,0.84 Q0.99,1 0.87,0.99 L0.04,0.97 Q0,0.97 0,0.88 L0,0.07 Q0,0 0.04,0 Z" />
              </clipPath>
            </defs>
          </svg>

          <div className="max-w-7xl mx-auto px-6 relative z-10">

            {/* ── PARTE 1: Problema + imagem ── */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start mb-20">

              {/* Placa orgânica branca — problema */}
              <Reveal>
                <div className="bg-white text-[#1A1A1A] p-8 md:p-10"
                  style={{borderRadius:'60px 140px 60px 40px / 40px 60px 120px 60px'}}>
                  <Tag text="o desafio" align="left" />
                  <h2 className="font-display text-4xl md:text-5xl font-black leading-tight mb-6">
                    Uma luta essencial,<br/>
                    <span style={{color:'#FF5C39'}}>sem um lugar fixo</span>
                  </h2>
                  <div className="space-y-4">
                    {[
                      "Atuamos em espaços improvisados, alugados e inconstantes.",
                      "Documentos, arquivos e atendimentos não têm a estrutura que merecem.",
                      "A falta de espaço limita nossa equipe, os atendimentos e o acolhimento.",
                      "Sonhamos com um lugar seguro, acessível e feito para transformar vidas."
                    ].map((t,i) => (
                      <div key={i} className="flex gap-3 items-start">
                        <div className="w-6 h-6 rounded-full flex-shrink-0 mt-0.5 flex items-center justify-center"
                          style={{backgroundColor:'#FF5C39'}}>
                          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                        </div>
                        <p className="text-base font-medium leading-snug" style={{color:'rgba(26,26,26,0.82)'}}>{t}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </Reveal>

              {/* Imagem com clip-path orgânico + blob vermelho sobreposto */}
              <Reveal delay={200} className="relative pt-4">
                <div className="w-full" style={{aspectRatio:'16/10', clipPath:'url(#officeClip)'}}>
                  <img src="assets/img/2.png" alt="Escritório improvisado do CEDECA" className="w-full h-full object-cover" />
                </div>
                {/* Blob orgânico vermelho-escuro */}
                <div className="absolute -bottom-8 -right-2 w-44 h-44 bg-[#922B21] text-white flex flex-col items-center justify-center text-center p-5 shadow-2xl"
                  style={{borderRadius:'60% 40% 30% 70% / 60% 30% 70% 40%'}}>
                  <svg className="mb-2 flex-shrink-0" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
                  </svg>
                  <p style={{fontSize:'10px',fontWeight:'700',lineHeight:'1.4'}}>Hoje, a estrutura que temos não acompanha a urgência da nossa missão.</p>
                </div>
              </Reveal>
            </div>

            {/* ── PARTE 2: Solução ── */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 items-end mb-12">

              {/* Texto da solução */}
              <Reveal>
                <p className="font-black uppercase tracking-widest mb-2" style={{fontSize:'11px',opacity:0.55}}>A Casa dos Direitos:</p>
                <h2 className="font-display text-3xl md:text-4xl font-black leading-tight mb-4">
                  <span className="text-[#D4FF00]">o futuro que<br/>queremos construir</span>
                </h2>
                <p className="text-sm leading-relaxed" style={{opacity:0.8}}>
                  Um espaço permanente, acolhedor e acessível para fortalecer ainda mais a defesa dos direitos de crianças e adolescentes no Tocantins.
                </p>
              </Reveal>

              {/* Terreno → seta → Casa */}
              <div className="lg:col-span-2">
                <div className="flex items-end gap-4">

                  {/* Terreno + selo orgânico */}
                  <Reveal delay={100} className="flex-1 relative pb-8">
                    <div className="w-full overflow-hidden" style={{aspectRatio:'4/3', borderRadius:'32px 12px 40px 12px'}}>
                      <img src="assets/img/3.png" alt="Terreno adquirido" className="w-full h-full object-cover" />
                    </div>
                    <div className="absolute bottom-0 left-2 bg-[#B8F070] text-[#1A1A1A] px-3 py-1.5 flex items-center gap-1.5 shadow-lg"
                      style={{fontSize:'11px',fontWeight:'900',borderRadius:'36px 8px 36px 8px'}}>
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                      </svg>
                      Terreno já adquirido
                    </div>
                  </Reveal>

                  {/* Seta discreta */}
                  <Reveal delay={200} className="flex-shrink-0 pb-12">
                    <svg width="36" height="18" viewBox="0 0 36 18" fill="none">
                      <line x1="0" y1="9" x2="28" y2="9" stroke="rgba(255,255,255,0.5)" strokeWidth="1.5" strokeLinecap="round"/>
                      <path d="M22 3 L30 9 L22 15" stroke="rgba(255,255,255,0.5)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </Reveal>

                  {/* Casa dos Direitos */}
                  <Reveal delay={300} className="flex-1">
                    <div className="w-full overflow-hidden" style={{aspectRatio:'4/3', borderRadius:'12px 32px 12px 40px'}}>
                      <img src="assets/img/4.png" alt="Render da Casa dos Direitos" className="w-full h-full object-cover" />
                    </div>
                  </Reveal>
                </div>
              </div>
            </div>

            {/* ── PARTE 3: Faixa única de benefícios ── */}
            <div className="bg-white/10 px-8 py-8" style={{borderRadius:'48px 20px 48px 20px'}}>
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-8">
                {[
                  { ico:<IcoHome c="w-6 h-6 text-white"/>,        bg:"bg-[#0099FF]", title:"Espaço próprio e adequado",     desc:"Ambientes estruturados para atendimentos, formações e reuniões." },
                  { ico:<IcoHeart c="w-6 h-6 text-white"/>,       bg:"bg-[#FF3366]", title:"Mais acolhimento, mais impacto", desc:"Melhores condições para receber crianças, famílias e parceiros." },
                  { ico:<IcoShield c="w-6 h-6 text-[#1A1A1A]"/>, bg:"bg-[#D4FF00]", title:"Fortalecimento da rede",         desc:"Um centro de referência para a garantia de direitos no Tocantins." },
                  { ico:<IcoCheck c="w-6 h-6 text-[#1A1A1A]"/>,  bg:"bg-[#B8F070]", title:"Sustentabilidade da missão",     desc:"Um lar permanente para seguir transformando infâncias." },
                ].map((b,i) => (
                  <Reveal key={i} delay={i*80}>
                    <div className="flex flex-col gap-3">
                      <div className={`w-12 h-12 rounded-full ${b.bg} flex items-center justify-center flex-shrink-0`}>{b.ico}</div>
                      <h4 className="font-bold text-sm leading-snug">{b.title}</h4>
                      <p className="text-xs leading-snug" style={{opacity:0.6}}>{b.desc}</p>
                    </div>
                  </Reveal>
                ))}
              </div>
            </div>

          </div>
        </section>

        {/* ══ DEPOIMENTO ══ */}
        <section className="py-24 bg-[#1A1A1A] text-[#F2F0E6]">
          <div className="max-w-4xl mx-auto px-6 text-center">
            <Reveal>
              <div className="flex justify-center mb-8">
                <div className="w-28 h-28 rounded-full overflow-hidden border-4 border-[#D4FF00]">
                  <img src="assets/img/5.png" alt="Criança atendida pelo CEDECA" className="w-full h-full object-cover" />
                </div>
              </div>
              <h2 className="font-display text-4xl md:text-5xl font-black mb-10">Essa luta já mudou muitas histórias</h2>
              <blockquote className="text-2xl md:text-3xl font-display font-bold leading-snug text-[#D4FF00] mb-6">
                "Em um momento muito difícil, o CEDECA me escutou, me protegeu e me ajudou a recomeçar. Hoje eu sei que meus direitos importam e que não estou sozinha."
              </blockquote>
              <p className="text-lg opacity-60">— Ana Clara, 13 anos, atendida pelo CEDECA</p>
              <div className="mt-16 pt-12 border-t border-white/15">
                <p className="text-xl max-w-2xl mx-auto">Há quase 20 anos, o CEDECA atua na defesa dos direitos de crianças e adolescentes, sendo <strong className="text-[#0099FF]">referência nacional</strong> nessa área.</p>
              </div>
            </Reveal>
          </div>
        </section>

        {/* ══ MOVIMENTO COLETIVO ══ */}
        <section className="py-24 bg-[#F2F0E6]">
          <div className="max-w-7xl mx-auto px-6">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
              <Reveal>
                <Tag text="movimento coletivo" align="left" />
                <h2 className="font-display text-5xl md:text-6xl font-black mb-6">Essa construção não acontece sozinha</h2>
                <p className="text-xl text-[#1A1A1A]/75 mb-8 max-w-lg">
                  Ela depende de pessoas que acreditam que defender direitos é um compromisso coletivo.
                  <span className="font-bold text-[#FF5C39]"> Cada doação é um passo na construção dessa casa.</span>
                </p>
                <button onClick={()=>goTo('doacao')}
                  className="inline-flex items-center gap-2 bg-[#1A1A1A] text-[#F2F0E6] px-8 py-4 rounded-full font-bold text-lg hover:bg-[#D4FF00] hover:text-[#1A1A1A] transition-colors duration-300">
                  Quero fazer parte <IcoHeart c="w-5 h-5" />
                </button>
              </Reveal>
              <Reveal delay={200}>
                <div className="rounded-[40px] overflow-hidden organic-shape-1 aspect-[4/3]">
                  <img src="assets/img/6.png" alt="Crianças unidas" className="w-full h-full object-cover" />
                </div>
              </Reveal>
            </div>
          </div>
        </section>

        {/* ══ DOAÇÃO (componente dedicado) ══ */}
        <DonationSection />

        {/* ══ PARCEIROS ══ */}
        <section className="py-16 border-y border-[#1A1A1A]/10">
          <div className="max-w-5xl mx-auto px-6">
            <p className="text-center font-bold text-xs tracking-widest uppercase mb-10 text-[#1A1A1A]/50">Instituições que fazem acontecer</p>
            <div className="flex flex-wrap justify-center items-center gap-10 md:gap-16">
              <img src="assets/logos/logo-cedeca-preto.png"   alt="CEDECA"         className="h-20 w-auto object-contain grayscale hover:grayscale-0 transition-all duration-300" />
              <img src="assets/logos/logo-kinder-preto.png"   alt="Kindernothilfe" className="h-10 w-auto object-contain grayscale hover:grayscale-0 transition-all duration-300" />
              <img src="assets/logos/logo-misereor-preto.png" alt="Misereor"       className="h-10 w-auto object-contain grayscale hover:grayscale-0 transition-all duration-300" />
            </div>
            <p className="text-center mt-10 text-[#1A1A1A]/65 font-medium max-w-md mx-auto text-sm">
              Uma organização com quase 20 anos de atuação na defesa de direitos humanos.
            </p>
          </div>
        </section>

      </main>

      {/* ══ FOOTER ══ */}
      <footer className="bg-[#1A1A1A] text-[#F2F0E6] py-20 relative overflow-hidden">
        <div className="absolute -bottom-1/2 -right-1/4 w-[700px] h-[700px] bg-[#D4FF00] rounded-full mix-blend-multiply opacity-15 blur-3xl pointer-events-none"></div>
        <div className="max-w-6xl mx-auto px-6 relative z-10">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center mb-16">
            <Reveal>
              <h2 className="font-display text-4xl md:text-5xl font-black mb-6 leading-tight">
                Construir essa casa é fortalecer o CEDECA para que siga atuando com ainda mais estrutura.
              </h2>
              <p className="text-xl text-[#D4FF00] mb-10 font-medium">Para que mais crianças e adolescentes tenham seus direitos defendidos.</p>
              <button onClick={()=>goTo('doacao')}
                className="bg-[#D4FF00] text-[#1A1A1A] px-10 py-5 rounded-full font-display font-black text-xl hover:scale-105 transition-transform duration-300">
                Fazer parte dessa construção
              </button>
            </Reveal>
            <Reveal delay={250} className="flex justify-center lg:justify-end">
              <div className="w-56 h-56 rounded-full overflow-hidden organic-shape-1 float-anim border-4 border-[#D4FF00]">
                <img src="assets/img/7.png" alt="Criança sorrindo" className="w-full h-full object-cover" />
              </div>
            </Reveal>
          </div>
          <div className="pt-8 border-t border-white/15 flex flex-col md:flex-row justify-between items-center gap-6">
            <img src="assets/logos/logo-cedeca-branca.png" alt="CEDECA" className="h-14 w-auto" />
            <div className="text-center">
              <p className="font-display font-bold">casa dos direitos</p>
              <a href="https://doar.cedecato.org.br" className="text-sm opacity-50 hover:opacity-80 transition-opacity">doar.cedecato.org.br</a>
            </div>
            <p className="text-sm opacity-40">© {new Date().getFullYear()} CEDECA Tocantins</p>
          </div>
        </div>
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
